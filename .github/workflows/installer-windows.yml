name: KF7 Corp Enterprise - Instalador

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-installer:
    name: Criar instalador Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Validar Python
        run: python -m py_compile KF7_Corp_Enterprise_v2.py

      - name: Gerar aplicativo
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "KF7 Corp Enterprise" `
            KF7_Corp_Enterprise_v2.py

      - name: Instalar Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Criar instalador
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer.iss"

      - name: Verificar instalador
        shell: powershell
        run: |
          $installer = "installer\KF7-Corp-Enterprise-Setup.exe"

          if (!(Test-Path $installer)) {
              Write-Error "O instalador não foi criado."
              exit 1
          }

          Write-Host "Instalador criado com sucesso!"
          Get-Item $installer | Select-Object Name, Length, FullName

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: KF7-Corp-Enterprise-Setup
          path: "installer/KF7-Corp-Enterprise-Setup.exe"
          if-no-files-found: error
          retention-days: 30
